name: Metrics

# Auto-triggers disabled — SVGs no longer referenced in README.
# Run manually via GitHub Actions tab if needed.
on:
  workflow_dispatch:

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Main metrics
        uses: dkhokhlov/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LarsArtmann
          filename: metrics.svg
          template: classic
          base: header, activity, community, metadata
          base_indepth: yes
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: Europe/Berlin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_habits: no
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 12
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes
          plugin_notable_filter: stars:>10
          plugin_activity: no

      - name: Featured repositories
        uses: dkhokhlov/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LarsArtmann
          filename: metrics.repositories.svg
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: dynamic-markdown-site, go-filewatcher, art-dupl, emeet-pixyd, go-branded-id

      - name: Generate trophies
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: LarsArtmann
          file: trophies.svg
          token: ${{ secrets.METRICS_TOKEN }}
          theme: onestar
          no-background: true
          max-cols: 8
          margin-width: 15
          margin-height: 15

      - name: Commit and push
        run: |-
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          cp trophy.svg trophies.svg 2>/dev/null || true
          git add trophies.svg
          git diff --staged --quiet || git commit -m "Update trophies - [Skip GitHub Action]"
          git push
